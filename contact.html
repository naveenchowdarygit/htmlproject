<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contact | EduWebinars</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family:'Segoe UI'; background:#f0f5fb; margin:0; }

header {
    background:#3a7ca5; color:white; padding:20px; text-align:center;
    border-bottom:4px solid #2f6690; border-radius:0 0 18px 18px;
}

nav {
    background:#2f6690; text-align:center; padding:12px;
}

nav a {
    color:white; text-decoration:none; padding:10px 18px;
    font-weight:bold; border-radius:8px; margin:2px; display:inline-block;
}

nav a:hover { background:white; color:#2f6690; }

form {
    width:400px; background:white; margin:40px auto; padding:25px;
    border-radius:12px; border:1px solid #e3e6ea;
    box-shadow:0 6px 18px rgba(0,0,0,0.05);
}

label { color:#2f6690; font-weight:bold; display:block; margin-top:10px; }

input, textarea {
    width:100%; padding:10px; margin-top:6px; border-radius:8px;
    border:1px solid #ccd9e3;
}

button {
    background:#3a7ca5; color:white; width:100%; padding:10px;
    border:none; border-radius:8px; margin-top:20px; cursor:pointer;
}

button:hover { background:#2f6690; }

footer {
    background:#2f6690; color:white; text-align:center; padding:14px;
    border-top:4px solid #3a7ca5; margin-top:40px; border-radius:14px 14px 0 0;
}
</style>
</head>

<body>

<header><h1>Contact Us</h1></header>

<nav>
    <a href="index.html">Home</a>
    <a href="webinars.html">Webinars</a>
    <a href="workshops.html">Workshops</a>
    <a href="register.html">Register</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="login.html">Login</a>
</nav>

<form onsubmit="return saveContact()">
    <label>Your Name</label>
    <input type="text" id="cname" required>

    <label>Your Email</label>
    <input type="email" id="cemail" required>

    <label>Your Message</label>
    <textarea id="cmsg" rows="4" required></textarea>

    <button type="submit">Send Message</button>
</form>

<footer>
    &copy; 2025 EduWebinars | KL University
</footer>

<script>
function saveContact() {
    localStorage.setItem("contactName", document.getElementById("cname").value);
    localStorage.setItem("contactEmail", document.getElementById("cemail").value);
    localStorage.setItem("contactMsg", document.getElementById("cmsg").value);

    alert("Message Sent Successfully!");
    return false;
}
</script>

</body>
</html>
