<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Register | EduWebinars</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family:'Segoe UI',Arial; background:#f0f5fb; margin:0; }

header {
    background:#3a7ca5; color:white; text-align:center;
    padding:20px; border-bottom:4px solid #2f6690; border-radius:0 0 16px 16px;
}

nav {
    background:#2f6690; text-align:center; padding:12px;
}

nav a {
    text-decoration:none; color:white; padding:10px 18px;
    font-weight:bold; border-radius:8px; margin:2px; display:inline-block;
}

nav a:hover { background:white; color:#2f6690; }

form {
    max-width:450px; margin:40px auto; background:white;
    padding:25px; border-radius:12px; border:1px solid #e3e6ea;
    box-shadow:0 6px 18px rgba(0,0,0,0.05);
}

label { font-weight:bold; color:#2f6690; display:block; margin-top:10px; }

input, select {
    width:100%; padding:10px; margin-top:6px; border:1px solid #ccd9e3;
    border-radius:8px; box-sizing:border-box;
}

button {
    margin-top:20px; background:#3a7ca5; color:white;
    padding:10px; border:none; width:100%; border-radius:8px;
    cursor:pointer; font-weight:bold;
}

button:hover { background:#2f6690; }

footer {
    margin-top:40px; background:#2f6690; color:white; text-align:center;
    padding:14px; border-top:4px solid #3a7ca5; border-radius:16px 16px 0 0;
}
</style>
</head>

<body>

<header><h1>Event Registration</h1></header>

<nav>
    <a href="index.html">Home</a>
    <a href="webinars.html">Webinars</a>
    <a href="workshops.html">Workshops</a>
    <a href="register.html">Register</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="login.html">Login</a>
</nav>

<form onsubmit="return saveRegistration()">
    <label>Full Name</label>
    <input type="text" id="name" required>

    <label>Email</label>
    <input type="email" id="email" required>

    <label>Select Event</label>
    <select id="event" required>
        <option value="">--Choose--</option>
        <option>Introduction to AI</option>
        <option>Advanced Python Techniques</option>
        <option>AI for Data Analytics</option>
        <option>Web Development Bootcamp</option>
        <option>Data Science Foundations</option>
        <option>Digital Marketing Mastery</option>
    </select>

    <button type="submit">Submit Registration</button>
</form>

<footer>
    &copy; 2025 EduWebinars | Team: Jeevan, Sharan, Naveen | KL University
</footer>

<script>
function saveRegistration() {
    localStorage.setItem("regName", document.getElementById("name").value);
    localStorage.setItem("regEmail", document.getElementById("email").value);
    localStorage.setItem("regEvent", document.getElementById("event").value);
    alert("Registration Successful!");
    return false;
}
</script>

</body>
</html>
